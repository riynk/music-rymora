name: Android debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-foundation

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rymora and upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" SDK package was removed by Google.
          # Install only platform-tools; Gradle resolves compile/build tools.
          packages: 'platform-tools'
      - name: Apply Rymora branding overlay
        run: bash scripts/bootstrap-android.sh
      - name: Run unit tests
        working-directory: android/vendor/koda
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build debug APK
        working-directory: android/vendor/koda
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rymora-android-debug
          path: android/vendor/koda/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
